services:
  socket-proxy:
    extends:
      file: ./traefik/docker-compose.yml
      service: socket-proxy
 
  # NOTE: `extends` does not carry over `depends_on` (or `links`/`volumes_from`)
  # from the sub-file, since those reference sibling services that may not
  # exist in this file's context. Compose drops them silently, so every
  # `depends_on` below has to be restated here at the top level.
  traefik:
    extends:
      file: ./traefik/docker-compose.yml
      service: traefik
    depends_on:
      socket-proxy:
        condition: service_started
 
  jellyfin:
    extends:
      file: ./jellyfin/docker-compose.yml
      service: jellyfin
    depends_on:
      traefik:
        condition: service_healthy
 
  bazarr:
    extends:
      file: ./bazarr/docker-compose.yml
      service: bazarr
    depends_on:
      traefik:
        condition: service_healthy
 
  jellyseer:
    extends:
      file: ./jellyseer/docker-compose.yml
      service: jellyseer
    depends_on:
      traefik:
        condition: service_healthy
 
  prowlarr:
    extends:
      file: ./prowlarr/docker-compose.yml
      service: prowlarr
    depends_on:
      traefik:
        condition: service_healthy
 
  qbittorrent:
    extends:
      file: ./qbittorrent/docker-compose.yml
      service: qbittorrent
    depends_on:
      traefik:
        condition: service_healthy
 
  radarr:
    extends:
      file: ./radarr/docker-compose.yml
      service: radarr
    depends_on:
      traefik:
        condition: service_healthy
 
  sonarr:
    extends:
      file: ./sonarr/docker-compose.yml
      service: sonarr
    depends_on:
      traefik:
        condition: service_healthy

  vaultwarden:
    extends:
      file: ./vaultwarden/docker-compose.yml
      service: vaultwarden
    depends_on:
      traefik:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - SIGNUPS_ALLOWED=true
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=true
      - LOG_LEVEL=warn

  uptime-kuma:
    extends:
      file: ./uptime-kuma/docker-compose.yml
      service: uptime-kuma
    depends_on:
      traefik:
        condition: service_healthy

  wedding-website:
    extends:
      file: ./wedding-website/docker-compose.yml
      service: wedding-website
    depends_on:
      traefik:
        condition: service_healthy

  staging-website:
    extends:
      file: ./wedding-website/docker-compose.staging.yml
      service: staging-website
    depends_on:
      traefik:
        condition: service_healthy

  # NOTE: `extends` resolves `${VAR}` in the sub-file against this project's
  # environment, not the sub-file's own `.env`, so the settings that must come
  # from the top-level `.env` are restated here (local keys win over extended).
  watchtower:
    extends:
      file: ./watchtower/docker-compose.yml
      service: watchtower
    environment:
      - TZ=${TZ}
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-true}
      - WATCHTOWER_ROLLING_RESTART=${WATCHTOWER_ROLLING_RESTART:-false}
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-}
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_DISCORD_URL:-}
  
networks:
  proxy:
    external: true