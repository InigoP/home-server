services:
  wedding-website:
    build: .
    container_name: wedding-website
    restart: unless-stopped
    environment:
      - RSVP_ADMIN_TOKEN=${RSVP_ADMIN_TOKEN:-changeme}
      - GOOGLE_SHEET_WEBHOOK_URL=${GOOGLE_SHEET_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wedding.rule=Host(`${TRAEFIK_WEDDING}`)"
      - "traefik.http.routers.wedding.entrypoints=https"
      - "traefik.http.routers.wedding.tls=true"
      - "traefik.http.routers.wedding.tls.certresolver=mydnschallenge"
      - "traefik.http.services.wedding.loadbalancer.server.port=3000"
      # Watchtower Update
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
