<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonia & Inigo — Save the Date</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23C85A70'>★</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/save-the-date.css">
</head>
<body>

  <div class="page">

    <!-- ── Film section ─────────────────────────────── -->
    <div class="film-section">

      <div class="sprocket-strip"></div>

      <div class="top-zone">

        <p class="now-showing">— now showing —</p>

        <div class="names-zone">
          <div class="name-slab pink">
            <span class="name">Sonia</span>
          </div>
          <span class="amp-line">&amp;</span>
          <div class="name-slab blue-purple">
            <span class="name">Inigo</span>
          </div>
        </div>

        <div class="event-callout">
          <p class="event-date">June 7, 2027</p>
          <p class="event-venue">Pavillon de la Jamaïque</p>
          <p class="event-city">Montréal, Québec</p>
        </div>

      </div>

      <div class="sprocket-strip"></div>

    </div>

    <!-- ── Cut-here separator ───────────────────────── -->
    <div class="cut-here">
      <span class="cut-scissors">✂</span>
      <div class="cut-dashes"></div>
      <span class="cut-label">detach &amp; return</span>
      <div class="cut-dashes"></div>
    </div>

    <!-- ── Address placard ──────────────────────────── -->
    <div class="placard">

      <div class="placard-header">
        <h2>Your Mailing Address</h2>
        <span class="reply-label">reply card</span>
      </div>

      <div class="placard-form">

        <div id="form-section-inner">
          <p class="form-subheading">We'll send your invitation by post.</p>

          <form id="address-form">
            <div class="row row-names">
              <label>
                <span>First name</span>
                <input type="text" name="first_name" autocomplete="given-name" required />
              </label>
              <label>
                <span>Last name</span>
                <input type="text" name="last_name" autocomplete="family-name" required />
              </label>
            </div>

            <label>
              <span>Address line 1</span>
              <input type="text" name="address1" autocomplete="address-line1" required />
            </label>

            <label>
              <span>Address line 2 (optional)</span>
              <input type="text" name="address2" autocomplete="address-line2" />
            </label>

            <div class="row row-city">
              <label>
                <span>City</span>
                <input type="text" name="city" autocomplete="address-level2" required />
              </label>
              <label>
                <span>State / Province</span>
                <input type="text" name="state" autocomplete="address-level1" required />
              </label>
            </div>

            <div class="row row-zip">
              <label>
                <span>Postal code</span>
                <input type="text" name="zip" autocomplete="postal-code" required />
              </label>
              <label>
                <span>Country</span>
                <input type="text" name="country" autocomplete="country-name" required />
              </label>
            </div>

            <button type="submit" id="submit-btn">Send My Address →</button>
            <p class="message" id="form-message"></p>
          </form>
        </div>

        <div id="thank-you-section" style="display:none;">
          <div class="thank-you">
            <strong>See You There!</strong>
            <span class="chip">Invitation incoming ★</span>
          </div>
        </div>

      </div>

    </div>

    <p class="page-note">* formal invitation to follow by post</p>

  </div>

  <script>
    document.getElementById('address-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('form-message');
      const data = Object.fromEntries(new FormData(this).entries());

      btn.disabled = true;
      btn.textContent = 'Sending...';
      msg.textContent = '';
      msg.className = 'message';

      try {
        const res = await fetch('/api/address', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error();
        document.getElementById('form-section-inner').style.display = 'none';
        document.getElementById('thank-you-section').style.display = 'block';
      } catch {
        msg.textContent = 'Something went wrong — please try again.';
        msg.className = 'message error';
        btn.disabled = false;
        btn.textContent = 'Send My Address →';
      }
    });
  </script>
</body>
</html>
