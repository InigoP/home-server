services:
  staging-website:
    build: .
    container_name: staging-website
    restart: unless-stopped
    environment:
      - RSVP_ADMIN_TOKEN=${RSVP_ADMIN_TOKEN:-changeme}
      - GOOGLE_SHEET_WEBHOOK_URL=${GOOGLE_SHEET_WEBHOOK_URL:-}
      # Email notifications (set all four to enable; omit to disable silently)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-}
    volumes:
      - ./data-staging:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wedding-staging.rule=Host(`staging.soniainigo.pingu93.com`)"
      - "traefik.http.routers.wedding-staging.entrypoints=https"
      - "traefik.http.routers.wedding-staging.tls=true"
      - "traefik.http.routers.wedding-staging.tls.certresolver=mydnschallenge"
      - "traefik.http.services.wedding-staging.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
